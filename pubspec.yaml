name: ezyventas_app
description: "EzyVentas movil - POS y ordenes de servicio (modo online)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP y sesion
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

  # Estado y navegacion
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Formato es-MX
  intl: ^0.20.3

  # Impresion termica, evidencias, WhatsApp y conectividad.
  # flutter_blue_plus se fija en la rama 1.x: la 2.x exige una licencia
  # comercial de pago para apps de empresas (ver README, decisiones tecnicas).
  flutter_blue_plus: ^1.35.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Figtree
      fonts:
        # Fuente variable (eje "wght" 300-900): Flutter aplica FontWeight sobre
        # el eje, por lo que no hace falta empaquetar cada instancia estatica.
        - asset: assets/fonts/Figtree-Variable.ttf
